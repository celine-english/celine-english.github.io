<title>셀린영어학원</title>

<style>
  :root{--navy:#193773;--ink:#0B1324;--sub:#5A6478;--paper:#FFFFFF}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  body{overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:var(--paper);padding-top:env(safe-area-inset-top,0px);box-sizing:border-box}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--paper);transition:opacity .35s;z-index:2}
  #splash img{width:96px;height:96px}
  #splash b{font-size:20px;letter-spacing:.04em;color:var(--navy)}
  #splash span{font-size:13px;color:var(--sub)}
  #splash a{font-size:13px;color:var(--navy);display:none;margin-top:8px}
  #splash.slow a{display:block}
  #splash.done{opacity:0;pointer-events:none}
  #push{position:fixed;left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:3;display:none;align-items:center;gap:10px;background:#FFFFFF;border-radius:16px;box-shadow:0 8px 28px rgba(16,24,40,.18),0 0 0 1px rgba(16,24,40,.06);padding:12px 12px 12px 14px;max-width:460px;margin:0 auto;font-size:14px}
  #push.on{display:flex}
  #push .bell{width:36px;height:36px;border-radius:11px;background:#EAF0FA;color:var(--navy);display:grid;place-items:center;flex:none}
  #push .bell svg{width:20px;height:20px}
  #push .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  #push .tx b{font-size:14.5px;color:var(--ink)}
  #push .tx span{font-size:12.5px;color:var(--sub);line-height:1.4}
  #push button{font:inherit;border:0;cursor:pointer}
  #push .go{background:var(--navy);color:#FFFFFF;font-weight:700;border-radius:10px;padding:9px 14px;flex:none}
  #push .go:disabled{opacity:.6}
  #push .x{background:none;color:var(--sub);font-size:20px;line-height:1;padding:6px;flex:none}
</style>
</head>
<body>

  <a href="https://script.google.com/macros/s/AKfycbwrFBb_0dt10IpN86N6wckQltX61qYC8YjVmXI2m4JYoKD0CuyNRhDqZ9UXh-uaHNzIXQ/exec" rel="noopener">화면이 안 열리면 여기를 눌러 주세요</a>

<div id="push" role="dialog" aria-live="polite" aria-label="알림 받기">
  <span class="bell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg></span>
  <span class="tx"><b id="push-t">등하원 알림 받기</b><span id="push-s">등원·하원하면 이 휴대폰으로 바로 알려 드려요</span></span>
  <button type="button" class="go" id="push-go">켜기</button>
  <button type="button" class="x" id="push-x" aria-label="닫기">×</button>
</div>
<iframe id="app" title="셀린영어학원 앱" src="https://script.google.com/macros/s/AKfycbwrFBb_0dt10IpN86N6wckQltX61qYC8YjVmXI2m4JYoKD0CuyNRhDqZ9UXh-uaHNzIXQ/exec" allow="camera; clipboard-write; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script>
  var sp=document.getElementById('splash');
  document.getElementById('app').addEventListener('load',function(){setTimeout(function(){sp.classList.add('done')},250)});
  setTimeout(function(){sp.classList.add('slow')},9000);

  /* ── 등하원 알림 ── 앱 안에서 로그인하면 아래 「켜기」 안내가 나와요 */
  var APP='https://script.google.com/macros/s/AKfycbwrFBb_0dt10IpN86N6wckQltX61qYC8YjVmXI2m4JYoKD0CuyNRhDqZ9UXh-uaHNzIXQ/exec';
  var VAPID='BFiTqlhMkCUnnkwEnra2ARtDKjj1p4Yh9ILuOha4NkhggoX57MgQdMgD37Gv9aCV-CVTYKzTzacnuIaU7xg1nsg';
  var swReg=null,user=null;
  var box=document.getElementById('push'),go=document.getElementById('push-go');
  function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
  var supported=('serviceWorker' in navigator)&&('PushManager' in window)&&('Notification' in window);
  var ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  var standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  try{firebase.initializeApp({apiKey:"AIzaSyAx5iIGJQEh5hlQld-1lNnp6oH6Fak08JM",authDomain:"celine-english.firebaseapp.com",projectId:"celine-english",storageBucket:"celine-english.firebasestorage.app",messagingSenderId:"15227783892",appId:"1:15227783892:web:dffb28462e79d54f594941"})}catch(e){}
  if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').then(function(r){swReg=r}).catch(function(){})}
  function key(u){return 'celine-push:'+u.name+':'+u.role}
  function show(t,s,btn){document.getElementById('push-t').textContent=t;document.getElementById('push-s').textContent=s;go.hidden=!btn;if(btn)go.textContent=btn;box.classList.add('on')}
  function hide(){box.classList.remove('on')}
  function offer(){
    hide();if(!user)return;
    if(ls(key(user))==='on'&&window.Notification&&Notification.permission==='granted')return;
    if(ls('celine-push-later:'+user.name)&&Date.now()-(+ls('celine-push-later:'+user.name))<3*864e5)return; // 닫으면 3일 뒤 다시
    if(ios&&!standalone){show('알림을 받으려면','공유 버튼 → 「홈 화면에 추가」로 설치한 뒤, 홈 화면 아이콘으로 열어 주세요.',null);return}
    if(!supported)return;
    if(Notification.permission==='denied'){show('알림이 꺼져 있어요','휴대폰 설정에서 이 앱의 알림을 허용하면 등하원 알림을 받을 수 있어요.',null);return}
    show('등하원 알림 받기',(user.display||user.name)+' 학생이 등원·하원하면 이 휴대폰으로 바로 알려 드려요','켜기');
  }
  window.addEventListener('message',function(e){
    if(!/\.googleusercontent\.com$/.test(new URL(e.origin).hostname))return;
    var d=e.data||{};
    if(d.type==='celine-ready'){ // 앱이 로그인 화면을 띄우면, 기억해 둔 정보로 바로 들어가기
      var sv=null;try{sv=JSON.parse(ls('celine-login')||'null')}catch(x){}
      if(sv&&sv.name&&sv.code&&e.source)e.source.postMessage({type:'celine-login',name:sv.name,code:sv.code,role:sv.role},e.origin);
      return;
    }
    if(d.type!=='celine-user')return;
    user=d.user&&d.user.name&&d.user.code?d.user:null;
    if(user&&user.keep)ls('celine-login',JSON.stringify({name:user.name,code:user.code,role:user.role}));else ls('celine-login',null); // 「로그인 상태 유지」
    offer();
  });
  document.getElementById('push-x').addEventListener('click',function(){if(user)ls('celine-push-later:'+user.name,String(Date.now()));hide()});
  go.addEventListener('click',function(){
    if(!user)return;var u=user;go.disabled=true;go.textContent='켜는 중…';
    Notification.requestPermission().then(function(p){
      if(p!=='granted')throw new Error('denied');
      return (swReg?Promise.resolve(swReg):navigator.serviceWorker.ready);
    }).then(function(reg){
      return firebase.messaging().getToken({vapidKey:VAPID,serviceWorkerRegistration:reg});
    }).then(function(token){
      if(!token)throw new Error('notoken');
      return fetch(APP,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'pushReg',name:u.name,code:u.code,role:u.role,token:token,device:(ios?'iPhone':/Android/.test(navigator.userAgent)?'Android':'PC')})});
    }).then(function(){
      ls(key(u),'on');show('알림이 켜졌어요','이제 등원·하원하면 이 휴대폰으로 알려 드려요.',null);setTimeout(hide,4000);
    }).catch(function(err){
      show('알림을 켜지 못했어요',String(err&&err.message)==='denied'?'알림을 허용해야 받을 수 있어요. 휴대폰 설정에서 허용해 주세요.':'잠시 뒤 다시 눌러 주세요.','다시');
    }).then(function(){go.disabled=false});
  });
</script>
</body>
</html>
